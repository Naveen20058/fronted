<!DOCTYPE html>
<html>

<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;
            height: 150px;

            padding: 20px;

            border: 5px solid black;

            margin: 30px;

            background-color: lightblue;
        }
    </style>
</head>

<body>

    <div class="box">
        <p>This is a paragraph inside the div</p>
    </div>

</body>

</html>
